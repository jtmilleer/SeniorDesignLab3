# Minimal pipeline: type-check, then run both test suites.
# Extend it as the project grows (coverage, cppcheck, building the frontend).
stages: [lint, test]

software-lint:
  stage: lint
  image: node:22
  script:
    - npm ci
    - npm run typecheck

firmware-host-tests:
  stage: test
  image: gcc:13
  script:
    - make -C firmware test

software-tests:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test
